appId: com.zenx.multilogin
productName: Zenx MultiLogin
copyright: Copyright (c) Zenx
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: resources/chromium
    to: chromium
    filter:
      - manifest.json
      - chromium-*/**
  - from: drizzle
    to: drizzle
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Zenx MultiLogin
  artifactName: Zenx-MultiLogin-Setup.exe
  runAfterFinish: true
  deleteAppDataOnUninstall: false
